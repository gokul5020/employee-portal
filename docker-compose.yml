version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: employee-portal-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: employee_portal
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  cache:
    image: redis:7-alpine
    container_name: employee-portal-cache
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: employee-portal-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=employee_portal
      - REDIS_HOST=cache
      - REDIS_PORT=6379
    depends_on:
      - db
      - cache

  frontend:
    build: ./frontend
    container_name: employee-portal-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
