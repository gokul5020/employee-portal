services:
  # 1. Python FastAPI Backend Service (Web Service - Free Tier)
  - type: web
    name: employee-portal-backend
    env: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./employee_portal.db
      - key: JWT_SECRET
        generateValue: true
      - key: AI_API_KEY
        sync: false
      - key: AI_API_URL
        value: https://api.openai.com/v1/chat/completions
      - key: AI_MODEL
        value: gpt-4o-mini

  # 2. React Frontend Web Service (Web Service - Free Tier)
  - type: web
    name: employee-portal-frontend
    env: docker
    plan: free
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    envVars:
      - key: VITE_API_BASE_URL
        value: https://employee-portal-backend-api.onrender.com/api
        type: build
      - key: PORT
        value: 80
